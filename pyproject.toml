[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-vision-studio"
version = "0.1.0"
description = "Local-first deterministic manufacturing vision evidence demo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manufacturing Vision Studio contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema[format]>=4.23,<5",
  "numpy>=2.1,<2.5",
  "pillow>=11.1,<13",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pillow>=10.2",
  "types-jsonschema>=4.23",
]

[project.scripts]
mvs-api = "manufacturing_vision_studio.cli:serve"
mvs-demo = "manufacturing_vision_studio.cli:demo"
mvs-evidence = "manufacturing_vision_studio.cli:evidence"
mvs-freecad = "manufacturing_vision_studio.cli:freecad"
mvs-mvtec = "manufacturing_vision_studio.cli:mvtec"

[tool.hatch.build.targets.wheel]
packages = ["src/manufacturing_vision_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["manufacturing_vision_studio"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
